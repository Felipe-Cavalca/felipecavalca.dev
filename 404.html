<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Opa, voce se perdeu</title>
  <meta name="description" content="Pagina 404 do site pessoal de Felipe Cavalca.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #161616;
      --muted: #444;
      --surface: rgba(255, 255, 255, 0.78);
      --border: rgba(0, 0, 0, 0.08);
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      --accent: #db3a34;
      --accent-2: #f59e0b;
      --bg-grad-a: #ffd9ba;
      --bg-grad-b: #ffd6d6;
      --bg-grad-base-a: #f4f1e8;
      --bg-grad-base-b: #ece7da;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, var(--bg-grad-a) 0%, transparent 45%),
        radial-gradient(circle at 90% 20%, var(--bg-grad-b) 0%, transparent 42%),
        linear-gradient(150deg, var(--bg-grad-base-a) 0%, var(--bg-grad-base-b) 100%);
      font-family: "Space Grotesk", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .card {
      width: min(700px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
      padding: 1.2rem;
    }

    .code {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.4rem 0 0.8rem;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 0.95;
    }

    p {
      margin: 0;
      color: #2f2f2f;
      max-width: 52ch;
    }

    .joke {
      margin-top: 0.9rem;
      padding: 0.9rem;
      border-radius: 14px;
      border: 1px dashed var(--border);
      background: rgba(255, 255, 255, 0.45);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.9rem;
    }

    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.72rem 1.1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.2s ease, background-color 0.2s ease;
      color: var(--text);
    }

    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { border: 1px solid var(--text); }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f4f7fb;
        --muted: #bcc6d4;
        --surface: rgba(18, 27, 39, 0.82);
        --border: rgba(230, 239, 255, 0.16);
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        --accent: #ff7b54;
        --accent-2: #d68b2a;
        --bg-grad-a: #1c2a3a;
        --bg-grad-b: #2f1f31;
        --bg-grad-base-a: #0d141f;
        --bg-grad-base-b: #121b27;
      }

      p { color: #d6deeb; }
      .joke { background: rgba(9, 14, 22, 0.34); }
      .btn-primary { color: #121212; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">Erro 404</p>
    <h1>Voce se perdeu no deploy.</h1>
    <p>
      Essa pagina nao existe. Talvez ela esteja em outra branch, em outro commit,
      ou apenas fugiu de uma review.
    </p>
    <div class="joke">
      Dica tecnica: se voce veio por um link quebrado, volte para a home antes que o GitHub Pages te adote.
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="/">Voltar para a home</a>
      <a class="btn btn-ghost" href="javascript:history.back()">Voltar</a>
    </div>
  </main>
</body>
</html>
